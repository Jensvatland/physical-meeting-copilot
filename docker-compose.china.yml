# China-first profile — FunASR/SenseVoice / Qwen-compatible endpoints preferred.
# Real model containers can be attached later; Meeting Core stays unchanged.
#
# FUNASR_ENABLED / MEETING_ASR select the FunASR stub for capability/health discovery.
# Transcription remains unavailable until FunASR is wired; leave FUNASR_ENABLED=0
# (default) to keep the simulated ASR demo path.
services:
  meeting-gateway:
    extends:
      file: docker-compose.yml
      service: meeting-gateway
    environment:
      MEETING_CORE_DB: /data/meetings.db
      MEETING_GATEWAY_HOST: 0.0.0.0
      MEETING_ALLOW_INSECURE_BIND: "1"
      MEETING_PROFILE: china
      FUNASR_ENABLED: ${FUNASR_ENABLED:-0}
      MEETING_ASR: ${MEETING_ASR:-sim}
      # QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      # QWEN_API_KEY: ${QWEN_API_KEY:-}
