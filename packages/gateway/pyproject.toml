[project]
name = "meeting-gateway"
version = "0.1.0"
description = "Realtime audio gateway for Physical Meeting Copilot"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "meeting-core",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "websockets>=13.0",
]

[project.scripts]
meeting-gateway = "meeting_gateway.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
src = ""
