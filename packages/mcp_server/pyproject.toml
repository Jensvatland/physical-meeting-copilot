[project]
name = "meeting-mcp"
version = "0.1.0"
description = "MCP server exposing Meeting Core resources and tools"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "mcp>=2.0.0",
  "meeting-core",
]

[project.scripts]
meeting-mcp = "meeting_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
src = ""
