[project]
name = "meeting-core"
version = "0.1.0"
description = "Provider-independent Meeting Core for Physical Meeting Copilot"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7",
]

[project.scripts]
meeting-eval = "meeting_core.eval.harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
src = ""
