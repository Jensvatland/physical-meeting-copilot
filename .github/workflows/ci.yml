name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Simulate meeting
        run: uv run python -m meeting_core.demo.simulate_meeting
      - name: Eval harness
        run: uv run python -m meeting_core.eval.harness
      - name: MCP list
        run: uv run python -m meeting_mcp --list
      - name: Mac smoke script
        run: |
          chmod +x scripts/mac-smoke.sh
          ./scripts/mac-smoke.sh
