name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Simulate meeting
        run: uv run python -m meeting_core.demo.simulate_meeting
      - name: Eval harness
        run: uv run python -m meeting_core.eval.harness
      - name: MCP list
        run: uv run python -m meeting_mcp --list
      - name: Mac smoke script
        if: matrix.python-version == '3.12'
        run: |
          chmod +x scripts/mac-smoke.sh
          ./scripts/mac-smoke.sh
