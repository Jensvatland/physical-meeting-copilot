name: Good first issue
description: Small, well-scoped task for new contributors
title: "[good first issue] "
labels: ["good first issue"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Concrete steps and definition of done
    validations:
      required: true
  - type: textarea
    id: pointers
    attributes:
      label: Code / doc pointers
      placeholder: e.g. clients/web/public/index.html, docs/STATUS.md
    validations:
      required: true
  - type: markdown
    attributes:
      value: Mentors — keep these sim-honest and runnable via `./scripts/mac-smoke.sh`.
