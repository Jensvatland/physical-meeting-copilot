name: Feature Request
description: Suggest an improvement or new capability aligned with the roadmap
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain or gap are you addressing?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      description: Keep Meeting Core provider-independent. Prefer adapters over core logic.
    validations:
      required: true
  - type: textarea
    id: usefulness
    attributes:
      label: Why it would be useful
    validations:
      required: true
  - type: dropdown
    id: languages
    attributes:
      label: Language impact
      options:
        - No change (zh-CN + en MVP)
        - Improves zh-CN / en path
        - Adds a new spoken language (post-MVP / adapter)
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Possible implementation
      description: Optional — sketches, APIs, adapters, or references
    validations:
      required: false
