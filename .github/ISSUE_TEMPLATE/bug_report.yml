name: Bug Report
description: Something unexpected happened (v0.1 preview — simulated ASR is expected)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Check [docs/STATUS.md](https://github.com/Jensvatland/physical-meeting-copilot/blob/main/docs/STATUS.md) first — simulated ASR/diarization/translation is expected in v0.1.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe? Expected vs actual.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Commands, clicks, or minimal scenario
      value: |
        1.
        2.
        3.

        ```bash
        ./scripts/mac-smoke.sh
        ```
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, browser, branch/commit if known
      value: |
        - OS:
        - Python:
        - Browser (if UI):
        - Commit / branch:
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Smoke / install
        - Meeting Core
        - Gateway / browser UI
        - MCP
        - Docs
        - Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs (redact secrets). Attach screenshots if useful.
    validations:
      required: false
