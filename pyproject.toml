[project]
name = "physical-meeting-copilot"
version = "0.1.0"
description = "Provider-independent runtime for AI-assisted physical meetings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "meeting-core",
  "meeting-mcp",
  "meeting-gateway",
]

[tool.uv.workspace]
members = ["packages/meeting_core", "packages/mcp_server", "packages/gateway"]

[tool.uv.sources]
meeting-core = { workspace = true }
meeting-mcp = { workspace = true }
meeting-gateway = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
  "jsonschema>=4.23",
  "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/meeting_core/tests", "packages/mcp_server/tests", "packages/gateway/tests"]
pythonpath = ["packages/meeting_core/src", "packages/mcp_server/src", "packages/gateway/src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
