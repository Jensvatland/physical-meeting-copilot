[project]
name = "physical-meeting-copilot"
version = "0.1.0"
description = "Provider-independent runtime for AI-assisted physical meetings (zh-CN + en MVP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Physical Meeting Copilot contributors" }]
keywords = ["meeting", "mcp", "asr", "mandarin", "transcription", "hermes"]
dependencies = [
  "meeting-core",
  "meeting-mcp",
  "meeting-gateway",
]

[project.urls]
Homepage = "https://github.com/Jensvatland/physical-meeting-copilot"
Repository = "https://github.com/Jensvatland/physical-meeting-copilot"
Issues = "https://github.com/Jensvatland/physical-meeting-copilot/issues"
Changelog = "https://github.com/Jensvatland/physical-meeting-copilot/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Jensvatland/physical-meeting-copilot/tree/main/docs"

[tool.uv.workspace]
members = ["packages/meeting_core", "packages/mcp_server", "packages/gateway"]

[tool.uv.sources]
meeting-core = { workspace = true }
meeting-mcp = { workspace = true }
meeting-gateway = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
  "jsonschema>=4.23",
  "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/meeting_core/tests", "packages/mcp_server/tests", "packages/gateway/tests"]
pythonpath = [
  "packages/meeting_core/src",
  "packages/mcp_server/src",
  "packages/gateway/src",
  "integrations",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
